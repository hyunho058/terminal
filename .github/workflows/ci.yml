name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app is macOS-only (Metal, AppKit), so CI runs on a macOS runner.
jobs:
  check:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show # honors rust-toolchain.toml (stable + rustfmt + clippy)

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --workspace --release
