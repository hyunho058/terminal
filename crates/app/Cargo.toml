[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "macOS terminal binary: winit event loop wiring term-core + renderer + config."
default-run = "crewterm"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "crewterm"
path = "src/main.rs"

[dependencies]
ai-monitor = { version = "0.1.0", path = "../ai-monitor" }
common.workspace = true
libc = "0.2.186"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
pollster = "1.0.1"
renderer.workspace = true
term-core.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
winit = "0.30.13"

[dev-dependencies]
# Dashboard layout is text, so it is pinned with snapshots (F6). Same version
# `term-core` already uses — no new crate enters the tree, and `/insta-review`
# works on these too.
insta = "1.48.0"
