[toolchain]
# Deliberately unpinned, so CI is always the next stable's early warning — and the
# cost of that is real, so write it down rather than a version number that rots.
#
# `stable` resolves to whatever each machine last installed, and the gap bites in
# one direction: a new clippy lint fails CI while a local `-D warnings` run stays
# green. That is not hypothetical. `main` sat red from 2026-09-04 on
# `clippy::chunks_exact_to_as_chunks`, new in 1.98 (released 2026-09-01), firing on
# code nobody had touched — while every developer machine still on 1.95 reported
# clean.
#
# So: run `rustup check` before claiming a branch is CI-ready, and read
# `gh pr checks` rather than the local run. Pin to a concrete version here if you
# would rather have reproducibility than the early warning — that is a trade, not
# an oversight to fix.
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin"]
